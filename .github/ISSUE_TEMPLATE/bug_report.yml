name: Bug report
description: Report incorrect or unexpected OdinCore behavior
title: "[Bug] "
labels: []
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Please provide the smallest handler/request example that reproduces the issue.
      render: csharp
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: OdinCore version
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: input
    id: dotnet
    attributes:
      label: .NET version
      placeholder: e.g. .NET 10.0
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include logs, stack traces, cache provider, hosting model, or other relevant details.
